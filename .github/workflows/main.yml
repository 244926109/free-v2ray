name: Update ProxyPool

on:
  schedule:
    - cron: '15 0,6,12,18 * * *'     # 每天 8点、14点、20点、第二天2点左右更新（北京时间）
  workflow_dispatch:                  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run ProxyPool Update
        run: |
          go run main.go   # 如果原项目入口不是 main.go，请改成正确的命令

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/
          git diff --staged --quiet || git commit -m "Update proxies $(date '+%Y-%m-%d %H:%M:%S')"
          git push
