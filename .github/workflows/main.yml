name: Update ProxyPool

on:
  schedule:
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest proxy files
        run: |
          mkdir -p source
          
          echo "📥 Downloading v2ray nodes..."
          curl -L -o source/v2ray-2.txt https://raw.githubusercontent.com/snakem982/proxypool/main/source/v2ray-2.txt
          
          echo "📥 Downloading Clash nodes..."
          curl -L -o source/clash-meta-2.yaml https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml
          
          echo "📥 Downloading sing-box nodes..."
          curl -L -o source/sing-box-2.json https://raw.githubusercontent.com/snakem982/proxypool/main/source/sing-box-2.json
          
          echo "✅ Update completed at $(date)"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/
          if git diff --staged --quiet; then
            echo "No new changes"
          else
            git commit -m "Update proxies $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
